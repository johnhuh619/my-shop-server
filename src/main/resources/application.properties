spring.application.name=mini-shop
spring.profiles.active=dev

# JWT Configuration
jwt.secret=minishop-secret-key-for-jwt-token-generation-must-be-at-least-256-bits
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:minishop
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Toss Payments
toss.payments.secret-key=${TOSS_SECRET_KEY:test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R}
toss.payments.client-key=${TOSS_CLIENT_KEY:test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq}
toss.payments.base-url=https://api.tosspayments.com/v1

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Rate Limiting
rate-limit.enabled=true
rate-limit.login.capacity=5
rate-limit.login.refill-tokens=5
rate-limit.login.refill-duration-seconds=60
rate-limit.register.capacity=3
rate-limit.register.refill-tokens=3
rate-limit.register.refill-duration-seconds=600
rate-limit.payment.capacity=10
rate-limit.payment.refill-tokens=10
rate-limit.payment.refill-duration-seconds=60

# Internal Jobs
internal.jobs.auth-key=local-internal-job-key
internal.jobs.scheduler.enabled=true
internal.jobs.order-expiration.interval-ms=60000
internal.jobs.order-expiration.batch-size=100
internal.jobs.retry.interval-ms=30000
internal.jobs.retry.batch-size=100
