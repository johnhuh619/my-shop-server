spring.application.name=mini-shop

# JWT Configuration
jwt.secret=minishop-secret-key-for-jwt-token-generation-must-be-at-least-256-bits
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:minishop
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Toss Payments
toss.payments.secret-key=${TOSS_SECRET_KEY:test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R}
toss.payments.client-key=${TOSS_CLIENT_KEY:test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq}
toss.payments.base-url=https://api.tosspayments.com/v1

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
