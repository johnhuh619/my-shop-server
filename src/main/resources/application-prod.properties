spring.application.name=mini-shop

# Cloud Run injects PORT env var
server.port=${PORT:8080}

# PostgreSQL (Supabase)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Redis (Upstash — TLS required, rediss:// protocol)
spring.data.redis.url=${REDIS_URL}

# Toss Payments
toss.payments.secret-key=${TOSS_SECRET_KEY}
toss.payments.client-key=test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq
toss.payments.base-url=https://api.tosspayments.com/v1

# CORS
cors.allowed-origins=http://localhost:5173,https://mini-shop-frontend.vercel.app,https://my-shop-server-sand.vercel.app,https://*.vercel.app

# Actuator
management.endpoints.web.exposure.include=health

# Logging
logging.level.root=WARN
logging.level.com.minishop=INFO

# Internal Jobs
internal.jobs.auth-key=${INTERNAL_JOBS_AUTH_KEY}
internal.jobs.scheduler.enabled=false
internal.jobs.order-expiration.batch-size=100
internal.jobs.retry.batch-size=100
