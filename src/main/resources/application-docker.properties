spring.application.name=mini-shop

# JWT
jwt.secret=${JWT_SECRET:minishop-secret-key-for-jwt-token-generation-must-be-at-least-256-bits}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:minishop}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:minishop}
spring.datasource.password=${DB_PASSWORD:minishop}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# Toss mock endpoint (WireMock in docker compose)
toss.payments.secret-key=${TOSS_SECRET_KEY:test_sk_minishop}
toss.payments.client-key=${TOSS_CLIENT_KEY:test_ck_minishop}
toss.payments.base-url=${TOSS_BASE_URL:http://pg-mock:8080/v1}
